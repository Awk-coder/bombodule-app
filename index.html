<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0C0E" />
    <title>Bombodule</title>
    <style>
      #intro { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #101115; animation: intro-out 0.25s ease-in 0.75s forwards; }
      #intro img { width: 192px; height: 192px; transform-origin: 50% 85%; animation: intro-pop 0.5s cubic-bezier(0.3, 1.4, 0.5, 1) both, intro-wobble 0.3s ease-in-out 0.5s; }
      @keyframes intro-pop { from { transform: scale(0.4) translateY(40px); opacity: 0; } 60% { opacity: 1; } }
      @keyframes intro-wobble { 33% { transform: rotate(-5deg); } 66% { transform: rotate(4deg); } }
      @keyframes intro-out { to { opacity: 0; transform: scale(1.04); visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) { #intro { display: none; } }
    </style>
  </head>
  <body style="background:#0B0C0E">
    <div id="app"></div>
    <!-- Cold-start intro; main.tsx removes it once it has played. -->
    <div id="intro" aria-hidden="true">
      <img src="/mascot.webp" alt="" />
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
